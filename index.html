<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeBoard — Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- MOBILE HOME / DESKTOP SIDEBAR -->
    <aside id="sidebar" class="screen active">
      <header class="sidebar-header">
        <h1 class="logo">LifeBoard</h1>
        <div id="streak" class="streak">🔥 0-day streak</div>
      </header>

      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pinned">⭐ Pinned</button>
        <button class="filter-btn" data-filter="😊">😊</button>
        <button class="filter-btn" data-filter="😢">😢</button>
        <button class="filter-btn" data-filter="😡">😡</button>
        <button class="filter-btn" data-filter="🤩">🤩</button>
        <button class="filter-btn" data-filter="😌">😌</button>
        <button class="filter-btn" data-filter="💪">💪</button>
        <button class="filter-btn" data-filter="⭐">⭐</button>
        <button class="filter-btn" data-filter="😔">😔</button>
      </div>

      <div id="entries-list" class="entries-list"></div>

      <button id="fab" class="fab" aria-label="New entry">+</button>
    </aside>

    <!-- DETAIL PANEL (desktop right side / mobile full screen) -->
    <main id="detail-panel" class="screen">
      <div id="detail-empty" class="detail-empty">
        <p>Select an entry or start writing</p>
      </div>

      <!-- VIEW ENTRY -->
      <div id="view-entry" class="detail-view hidden">
        <button class="back-btn" data-target="home">← Back</button>
        <div class="view-header">
          <span id="view-mood" class="mood-badge"></span>
          <time id="view-date"></time>
          <button id="view-pin" class="pin-btn" aria-label="Pin entry">☆</button>
        </div>
        <h2 id="view-title" class="view-title"></h2>
        <div id="view-text" class="view-text"></div>
        <div class="view-actions">
          <button id="btn-edit" class="btn btn-secondary">Edit</button>
          <button id="btn-delete" class="btn btn-danger">Delete</button>
        </div>
      </div>

      <!-- WRITE / EDIT ENTRY -->
      <div id="write-entry" class="detail-view hidden">
        <button class="back-btn" data-target="home">← Back</button>
        <h2 class="write-heading" id="write-heading">New Entry</h2>

        <label for="entry-title" class="field-label">Title <span class="optional">(optional)</span></label>
        <input type="text" id="entry-title" class="input" placeholder="Give this entry a title…">

        <label class="field-label">How are you feeling? <span class="required">*</span></label>
        <div id="mood-grid" class="mood-grid">
          <button class="mood-option" data-mood="😊">😊<span>Happy</span></button>
          <button class="mood-option" data-mood="😢">😢<span>Sad</span></button>
          <button class="mood-option" data-mood="😡">😡<span>Frustrated</span></button>
          <button class="mood-option" data-mood="🤩">🤩<span>Excited</span></button>
          <button class="mood-option" data-mood="😌">😌<span>Calm</span></button>
          <button class="mood-option" data-mood="💪">💪<span>Productive</span></button>
          <button class="mood-option" data-mood="⭐">⭐<span>Memorable</span></button>
          <button class="mood-option" data-mood="😔">😔<span>Bad Day</span></button>
        </div>
        <p id="mood-error" class="error-msg hidden">Please select a mood</p>

        <div class="prompt-section">
          <button id="btn-prompt" class="btn btn-prompt">✨ Give me a prompt</button>
          <p id="prompt-text" class="prompt-text hidden"></p>
        </div>

        <label for="entry-text" class="field-label">Write your thoughts…</label>
        <textarea id="entry-text" class="textarea" placeholder="What's on your mind?"></textarea>

        <button id="btn-save" class="btn btn-primary btn-save">Save Entry</button>
      </div>
    </main>
  </div>

  <!-- DELETE CONFIRMATION MODAL -->
  <div id="delete-modal" class="modal-overlay hidden">
    <div class="modal">
      <p class="modal-text">Are you sure you want to delete this entry?</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
